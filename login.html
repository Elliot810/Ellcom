<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Lincom</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Lincom</a>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <span class="badge">Demo-Modus</span>
    <h1>Willkommen zurück</h1>
    <p class="lead auth-lead">Jede E-Mail-Adresse und jedes Passwort funktionieren hier – es wird nichts gespeichert oder geprüft. Diese Seite zeigt nur den Ablauf.</p>

    <form id="login-form" class="auth-form">
      <label for="email">E-Mail-Adresse</label>
      <input type="email" id="email" name="email" placeholder="name@firma.de" required>

      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn btn-primary btn-block">Einloggen</button>
    </form>

    <p class="auth-note">Noch kein Konto? In dieser Demo einfach oben einloggen – es wird automatisch eines simuliert.</p>
    <a href="index.html" class="auth-back">← Zurück zur Startseite</a>
  </div>
</section>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value || 'demo@lincom.de';
    sessionStorage.setItem('lincomDemoEmail', email);
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
