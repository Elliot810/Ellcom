<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden – Lincom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<header class="top scrolled">
  <div class="wrap top-inner">
    <a href="index.html" class="brand"><span class="brand-mark">L</span>Lincom</a>
    <div class="top-actions"><a href="index.html" class="btn btn-ghost"><i data-lucide="arrow-left"></i>Zur Startseite</a></div>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <span class="brand-mark">L</span>
    <h1>Willkommen bei Lincom</h1>
    <p>Melde dich an, um die Demo zu öffnen.</p>
    <div class="auth-demo"><i data-lucide="info"></i><span>Demo-Modus: Jede E-Mail-Adresse und jedes Passwort funktionieren. Es wird nichts gespeichert oder geprüft.</span></div>

    <form id="login-form" class="auth-form">
      <label for="email">E-Mail-Adresse</label>
      <input type="email" id="email" name="email" placeholder="name@firma.de" autocomplete="email" required>
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
    </form>

    <p class="auth-foot">Noch kein Konto? In der Demo einfach anmelden – ein Konto wird simuliert.</p>
  </div>
</main>

<script>
  if (window.lucide) lucide.createIcons();
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value || 'demo@lincom.de';
    sessionStorage.setItem('lincomDemoEmail', email);
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
